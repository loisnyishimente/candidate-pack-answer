services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: request_desk
      POSTGRES_USER: request_desk
      POSTGRES_PASSWORD: request_desk
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U request_desk"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes: ["postgres_data:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://request_desk:request_desk@db/request_desk
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-in-production}
      SEED_USERS_PATH: /seed/users.json
      CORS_ORIGINS: http://localhost:3000
    volumes:
      - ./seed:/seed:ro
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build:
      context: ./frontend
      args: {VITE_API_URL: "http://localhost:8000"}
    ports: ["3000:80"]
    depends_on: [api]
volumes:
  postgres_data:

